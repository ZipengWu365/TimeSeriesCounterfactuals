name: Release

on:
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: "Publish to PyPI. Requires PyPI Trusted Publisher configuration for this repository/environment."
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and inspect package
        uses: hynek/build-and-inspect-python-package@v2

  release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload artifacts to GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tscfbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
